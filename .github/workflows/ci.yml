name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Tier 1-2 only (heuristics, schema reader, resolver, config,
        # golden-fixture tests) — no Postgres available in CI, so the
        # Tier 3 `integration` build-tagged tests are skipped here.
        run: go test ./...
