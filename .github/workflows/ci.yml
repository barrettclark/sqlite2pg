name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No branch filter: a PR against any base (e.g. a stacked audit-cycle
  # branch) still runs CI. Previously `branches: [main]` here meant such
  # PRs got no CI at all (issue #107 / M4).
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"

      - name: gofmt
        run: |
          out=$(gofmt -l -e . 2>&1)
          if [ -n "$out" ]; then echo "gofmt:"; echo "$out"; exit 1; fi

      - name: Lint
        # golangci-lint runs govet among others; no separate vet step.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Build
        run: go build ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go.mod is tidy
        # The release build no longer runs `go mod tidy` (issue #117): a
        # release must build the tagged tree verbatim. Enforce tidiness
        # here instead, so a drift is caught in review, not at release.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        # Tier 1-2 only (heuristics, schema reader, resolver, config,
        # golden-fixture tests) — no Postgres available in CI, so the
        # Tier 3 `integration` build-tagged tests are skipped here.
        run: go test ./...
