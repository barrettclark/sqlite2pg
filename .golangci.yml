version: "2"

run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - ineffassign   # assignments never used
    - staticcheck   # bugs, dead code, dubious constructs (bundles gosimple/stylecheck/unused)
    - unconvert     # redundant type conversions
    - misspell      # typos in comments and strings
  settings:
    errcheck:
      # Suppresses errcheck on every call to these, not just deferred ones.
      # Accepted trade-off: in non-test code the only .Close() not on a
      # read/connection handle is verify's `--out` report file, and every
      # fmt.Fprint* target is stdout, stderr, an in-memory buffer, or that
      # same report file — where a write or close error would at worst
      # truncate the report (tracked in issue #136).
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      # "DOUB" is a SQL type-name prefix (DOUBLE / DOUBLE PRECISION), not
      # a typo for "DOUBT".
      ignore-rules:
        - DOUB
    staticcheck:
      # -ST1005: a usage string ending in "..." is a false positive.
      # -QF1001/-QF1009: opinionated "could simplify" quickfixes.
      checks:
        - all
        - -ST1005
        - -QF1001
        - -QF1009
  exclusions:
    rules:
      # Test setup routinely ignores db.Exec errors on a fresh in-memory
      # database where an INSERT can't realistically fail.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
